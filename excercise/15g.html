<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>External Libraries</title>
  </head>
  <body>
    <script type="module">
      import dayjs from "https://unpkg.com/supersimpledev@8.5.0/dayjs/esm/index.js";
      import isSatSun from "./15g.js";
      let date = dayjs();
      console.log(date.format("ddd, MMM d"));
      console.log(isSatSun(date));

      date = dayjs().add(2, "day");
      console.log(date.format("ddd, MM d"));
      console.log(isSatSun(date));

      date = dayjs().add(4, "day");
      console.log(date.format("ddd, MMM D"));
      console.log(isSatSun(date));

      date = dayjs().add(6, "day");
      console.log(date.format("ddd, MMM D"));
      console.log(isSatSun(date));
    </script>
  </body>
</html>
